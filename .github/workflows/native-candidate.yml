name: Native release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consensus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            src/neuroshard/client/consensus/go.sum
            tools/protocolprobe/go.sum
      - run: go -C tools/protocolprobe test ./...
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
      - run: go -C src/neuroshard/client/consensus build -o "$RUNNER_TEMP/cometbft" github.com/cometbft/cometbft/cmd/cometbft
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
      - run: test "$("$RUNNER_TEMP/cometbft" version)" = '0.38.26'
      - uses: actions/upload-artifact@v4
        with:
          name: cometbft
          path: ${{ runner.temp }}/cometbft
  protocol:
    runs-on: ubuntu-24.04
    needs: consensus  # real-chain integration tests run on the reviewed CometBFT build, never skipped
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # release-check pins are verified against the qualified commit
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r docs/evolution-requirements.txt pytest==9.1.1 boto3==1.41.5 ijson==3.4.0 pyarrow==25.0.1
      - run: python -m pip install --no-deps --require-hashes -r docs/beacon-requirements.txt
      - run: python -m pip install --no-deps .
      - uses: actions/download-artifact@v8
        with:
          name: cometbft
          path: ${{ runner.temp }}/engine
      - run: chmod +x "$RUNNER_TEMP/engine/cometbft" && test "$("$RUNNER_TEMP/engine/cometbft" version)" = '0.38.26'
      - run: python -m pytest -q
        env:
          ATEN_CPU_CAPABILITY: default
          MKL_ENABLE_INSTRUCTIONS: SSE4_2
          COMETBFT_BINARY: ${{ runner.temp }}/engine/cometbft
          NEUROSHARD_REQUIRE_ENGINE: '1'
      - run: neuroshard --help && python -m neuroshard --version && neuroshard-chain --help && neuroshard-work --help
      - run: python scripts/documents_v4_results.py > "$RUNNER_TEMP/documents-v4-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: documents-v4-${{ matrix.python }}
          path: ${{ runner.temp }}/documents-v4-${{ matrix.python }}.json
  documents-v4-across-pythons:
    runs-on: ubuntu-24.04
    needs: protocol
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: documents-v4-*
          merge-multiple: true
      - run: cmp documents-v4-3.10.json documents-v4-3.12.json  # identical tool results on both versions
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build --outdir "$RUNNER_TEMP/neuroshard-dist"
      - run: python scripts/check_distribution.py "$RUNNER_TEMP/neuroshard-dist"
      - run: python -m twine check "$RUNNER_TEMP/neuroshard-dist/"*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/neuroshard-client"
          "$RUNNER_TEMP/neuroshard-client/bin/python" -m pip install "$RUNNER_TEMP/neuroshard-dist/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/neuroshard-client/bin/neuroshard" --help
          "$RUNNER_TEMP/neuroshard-client/bin/python" -m neuroshard --version
          "$RUNNER_TEMP/neuroshard-client/bin/neuroshard-data" --help
