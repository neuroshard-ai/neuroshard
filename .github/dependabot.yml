version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.txt includes the frozen docs runtimes, so version updates from here edit them too.
    open-pull-requests-limit: 0
    # The numerical stack is pinned by the testnet runtime and every execution contract.
    ignore:
      - dependency-name: torch
      - dependency-name: transformers
      - dependency-name: tokenizers
      - dependency-name: safetensors
      - dependency-name: huggingface-hub
      - dependency-name: numpy
      - dependency-name: protobuf
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    # These files are frozen reproduction runtimes; a version changes only with a new execution contract.
    open-pull-requests-limit: 0
  - package-ecosystem: gomod
    directory: /src/neuroshard/client/consensus
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /tools/protocolprobe
    schedule:
      interval: weekly
