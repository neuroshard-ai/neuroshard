[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroshard-ai"
version = "0.3.0a1"
description = "Experimental native blockchain for verified neural training"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{name = "NeuroShard contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch==2.9.1", "numpy==2.2.6", "grpcio==1.76.0", "protobuf==6.33.1",
  "cryptography==46.0.3", "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "build>=1.2,<2"]

[project.urls]
Homepage = "https://neuroshard.com"
Documentation = "https://docs.neuroshard.com"
Repository = "https://github.com/neuroshard-ai/neuroshard"
Issues = "https://github.com/neuroshard-ai/neuroshard/issues"

[project.scripts]
neuroshard = "neuroshard.publicnet.entrypoints:chain"
neuroshard-chain = "neuroshard.publicnet.entrypoints:chain"
neuroshard-work = "neuroshard.publicnet.entrypoints:worker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"neuroshard.demo" = ["*.proto"]
"neuroshard.lab" = ["*.proto"]
"neuroshard.protos" = ["*.proto"]
"neuroshard.publicnet" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
