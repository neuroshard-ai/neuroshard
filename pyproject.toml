[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroshard-ai"
version = "0.4.0"
description = "Experimental native blockchain for verified neural training"
readme = "PYPI_README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.10"
authors = [{name = "NeuroShard contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography==46.0.3", "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "build>=1.2,<2", "twine>=6,<7", "boto3==1.41.5"]
data = ["boto3==1.41.5", "ijson==3.4.0"]
collector = ["boto3==1.41.5", "ijson==3.4.0", "datasets==4.4.1", "transformers==4.57.3", "tokenizers==0.22.1"]

[project.urls]
Homepage = "https://neuroshard.com"
Documentation = "https://docs.neuroshard.com"
Repository = "https://github.com/neuroshard-ai/neuroshard"
Issues = "https://github.com/neuroshard-ai/neuroshard/issues"

[project.scripts]
neuroshard = "neuroshard.client.cli:main"
neuroshard-data = "neuroshard.dataflow.cli:main"
neuroshard-chain = "neuroshard.publicnet.entrypoints:chain"
neuroshard-work = "neuroshard.publicnet.entrypoints:worker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"neuroshard.demo" = ["*.proto"]
"neuroshard.lab" = ["*.proto"]
"neuroshard.protos" = ["*.proto"]
"neuroshard.publicnet" = ["data/*.txt"]
"neuroshard.client" = ["networks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
