location = /native-preview { return 301 /native-preview/; }
location /native-preview/api/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:38659/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
}
location /native-preview/network/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:38659/network/;
}
location = /native-preview/healthz {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:38659/healthz;
}
location = /native-preview/rpc {
    client_max_body_size 32k;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:38659/rpc;
    proxy_read_timeout 40s;
}
location /native-preview/ {
    root /var/www/neuroshard;
    try_files $uri $uri/ /native-preview/index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Cache-Control no-cache;
}

location /native-preview/work/ {
    client_max_body_size 2m;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:38660/work/;
    proxy_read_timeout 40s;
}
location /native-preview/docs/ {
    root /var/www/neuroshard;
    types { }
    default_type text/plain;
    add_header X-Content-Type-Options nosniff;
}
