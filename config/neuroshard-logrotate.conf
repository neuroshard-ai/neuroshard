# Adapt these paths and the service account to your node homes.
# Rotate text logs only. Never rotate signing state, keys or databases.
/home/ubuntu/.neuroshard/llm-testnet/logs/*.log {
    su ubuntu ubuntu
    daily
    maxsize 25M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
