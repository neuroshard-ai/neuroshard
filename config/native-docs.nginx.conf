# Include inside docs.neuroshard.com's TLS server block.
root /var/www/neuroshard/current/docs;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
location /guide/ { return 302 /generated/PUBLIC_TESTNET; }
location /architecture/ { return 302 /generated/PROTOCOL_CANDIDATE_V2; }
location /economics/ { return 302 /generated/PROTOCOL_CANDIDATE_V2; }
location /governance/ { return 302 /generated/GOVERNANCE; }
location /api/ { return 302 /generated/API; }
location /assets/ { try_files $uri =404; expires 1y; }
location / { try_files $uri $uri.html $uri/ =404; }
